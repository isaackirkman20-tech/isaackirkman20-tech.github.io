<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visitor Registration</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 480px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #222;
    }
    h1 { font-size: 1.6rem; }
    fieldset { border: 1px solid #999; padding: 1rem; }
    legend { font-weight: bold; padding: 0 0.5rem; }
    label { display: block; margin-top: 1rem; }
    input[type="text"],
    input[type="email"],
    input[type="date"] {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      box-sizing: border-box;
    }
    .buttons { margin-top: 1.5rem; }
    button { padding: 0.5rem 1.25rem; font-size: 1rem; }
    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #ccc;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>Welcome, Visitor!</h1>
  <p>Please tell us a little about yourself.</p>

  <form action="#" method="post">
    <fieldset>
      <legend>Your Information</legend>

      <label for="name">Name
        <input type="text" id="name" name="name"
               placeholder="Jane Doe" required>
      </label>

      <label for="email">E-mail
        <input type="email" id="email" name="email"
               placeholder="jane@example.com" required>
      </label>

      <label for="birthdate">Birthdate
        <input type="date" id="birthdate" name="birthdate"
               placeholder="YYYY-MM-DD"
               pattern="\d{4}-\d{2}-\d{2}"
               max="2026-11-25" required>
      </label>

      <div class="buttons">
        <button type="submit">Submit</button>
        <button type="reset">Clear</button>
      </div>
    </fieldset>
  </form>

  <footer>
    <p>Created by: <strong>Your Name</strong><br>
    E-mail: <a href="mailto:you@example.com">you@example.com</a></p>
  </footer>
  <a href="table 2.html"> back to home page</a>
</body>
</html>
