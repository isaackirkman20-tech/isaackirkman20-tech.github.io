<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request a Brochure</title>
</head>
<body>
  <h1>Request a Brochure</h1>
  <p>Fill out the form below and we will mail a brochure to you.</p>

  <form action="/submit-request" method="post">

    <fieldset>
      <legend>Contact Information</legend>
      <p>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
      </p>
      <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
      </p>
      <p>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
      </p>
    </fieldset>

    <fieldset>
      <legend>Mailing Address</legend>
      <p>
        <label for="street">Street Address:</label>
        <input type="text" id="street" name="street" required>
      </p>
      <p>
        <label for="apt">Apt/Suite:</label>
        <input type="text" id="apt" name="apt">
      </p>
      <p>
        <label for="city">City:</label>
        <input type="text" id="city" name="city" required>
      </p>
      <p>
        <label for="state">State:</label>
        <select id="state" name="state" required>
          <option value="">-- Select --</option>
          <option value="AL">Alabama</option>
          <option value="CA">California</option>
          <option value="NY">New York</option>
          <option value="TX">Texas</option>
          <!-- add remaining states -->
        </select>
      </p>
      <p>
        <label for="zip">ZIP Code:</label>
        <input type="text" id="zip" name="zip" pattern="\d{5}(-\d{4})?"
               title="Enter a 5-digit ZIP code" required>
      </p>
    </fieldset>

    <fieldset>
      <legend>Brochure Options</legend>
      <p>Brochure type:</p>
      <p>
        <input type="radio" id="product" name="type" value="product" checked>
        <label for="product">Product</label>
        <input type="radio" id="services" name="type" value="services">
        <label for="services">Services</label>
        <input type="radio" id="catalog" name="type" value="catalog">
        <label for="catalog">Catalog</label>
      </p>
      <p>Also send me:</p>
      <p>
        <input type="checkbox" id="news" name="extras" value="news">
        <label for="news">Newsletter</label>
        <input type="checkbox" id="offers" name="extras" value="offers">
        <label for="offers">Special offers</label>
      </p>
      <p>
        <label for="comments">Comments:</label><br>
        <textarea id="comments" name="comments" rows="4" cols="40"></textarea>
      </p>
    </fieldset>

    <p>
      <input type="submit" value="Submit">
      <input type="reset" value="Reset">
    </p>
  </form>
   <a href="table 2.html"> back to home page</a>
</body>
</body>
</html>
