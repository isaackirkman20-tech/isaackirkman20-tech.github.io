<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embedded Style (link + class)</title>
  <style>
    body {
      background-color: white;
      color: black;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      text-decoration: none;
      color: black;
    }

    .new {
      font-weight: bold;
      font-style: italic;
    }
  </style>
</head>
<body>
  <a href="home.html">Home page</a>
  <p class="new">Hello</p>
</body>
</html>
