<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Feedback</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: bold; }
    input[type="text"], input[type="email"], textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 0.6rem 1.2rem; }
    footer { margin-top: 3rem; border-top: 1px solid #ccc; padding-top: 1rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>We Value Your Feedback</h1>
    <p>Please tell us what you think of our website. Fields marked * are required.</p>
  </header>

  <main>
    <form action="submit-feedback.php" method="post">
      <label for="name">Name</label>
      <input type="text" id="name" name="name">

      <label for="email">E-mail address *</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">

      <label for="comments">Comments * (maximum 1600 characters)</label>
      <textarea id="comments" name="comments" rows="10" maxlength="1600" required></textarea>

      <button type="submit">Send Feedback</button>
      <button type="reset">Clear</button>
    </form>
  </main>

  <footer>
    <p>Created by: Your Name<br>
    E-mail: <a href="mailto:you@example.com">you@example.com</a></p>
  </footer>
  <a href="table 2.html"> back to home page</a>
</body>
</html>
